<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cortex Atlas &mdash; Commercial Data Governance</title>
<style>
  /* ===== shared Cortex .dx-* design system (reused verbatim) ===== */
  :root{
    --ink:#09131B; --ink-2:#14222C; --indigo:#595959; --indigo-2:#3F3F3F;
    --surface:#F4F4F4; --card:#FFFFFF; --line:#D6DCE4; --line-dark:rgba(214,220,228,.16);
    --text:#09131B; --text-2:#595959; --text-inv:#F4F4F4; --text-inv-2:#A9AFB6;
    --teal:#F89739; --teal-deep:#E8451C; --violet:#E8451C; --amber:#0563C1; --sky:#8B8B8B;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,19,43,.06), 0 8px 24px rgba(20,19,43,.06);
    --shadow-lg:0 20px 60px rgba(20,19,43,.18);
    --display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--display);color:var(--text);background:var(--surface);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  #atApp{position:fixed;inset:0;background:var(--surface);color:var(--text);display:none;flex-direction:column;font-family:var(--display)}
  #atApp.open{display:flex}
  .dx-bar{height:60px;flex:none;background:#09131B;color:#F4F4F4;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid rgba(214,220,228,.14)}
  .dx-back{display:inline-flex;align-items:center;gap:7px;background:rgba(244,244,244,.07);border:1px solid rgba(214,220,228,.16);color:#F4F4F4;border-radius:9px;padding:8px 13px;font:600 13px var(--display);cursor:pointer}
  .dx-back:hover{background:rgba(244,244,244,.13)}
  .dx-titlewrap{display:flex;flex-direction:column;line-height:1.15}
  .dx-titlewrap b{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .dx-titlewrap span{font-size:11px;color:#A9AFB6}
  .dx-brandchip{display:inline-flex;align-items:center;gap:8px;background:rgba(248,151,57,.13);border:1px solid rgba(248,151,57,.3);color:#F89739;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
  .dx-brandchip .pdot{width:7px;height:7px;border-radius:50%;background:#F89739}
  .dx-live{display:inline-flex;align-items:center;gap:7px;background:rgba(30,127,79,.16);border:1px solid rgba(30,127,79,.4);color:#7FD1A8;border-radius:999px;padding:6px 12px;font:600 11.5px var(--display)}
  .dx-live .ld{width:7px;height:7px;border-radius:50%;background:#2faf6f;box-shadow:0 0 0 3px rgba(47,175,111,.25)}
  .dx-filters{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  .dx-sel{background:rgba(244,244,244,.06);border:1px solid rgba(214,220,228,.16);color:#F4F4F4;border-radius:9px;padding:8px 11px;font:500 12.5px var(--display);cursor:pointer}
  .dx-sel option{color:#09131B}
  .dx-refresh{font-size:11px;color:#A9AFB6;display:flex;align-items:center;gap:6px}
  .dx-shell{flex:1;display:flex;min-height:0}
  .dx-nav{width:258px;flex:none;background:#0E1A22;border-right:1px solid rgba(214,220,228,.1);padding:14px 12px;overflow:auto}
  .dx-navh{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#7E8794;padding:10px 12px 6px}
  .dx-navi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#C7CCD3;font:600 13.5px var(--display);padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
  .dx-navi svg{width:18px;height:18px;flex:none;color:#7E8794}
  .dx-navi:hover{background:rgba(244,244,244,.05);color:#fff}
  .dx-navi.on{background:rgba(248,151,57,.14);color:#fff}
  .dx-navi.on svg{color:#F89739}
  .dx-main{flex:1;overflow:auto;padding:26px 30px 70px;min-width:0}
  .dx-sec{display:none}
  .dx-sec.on{display:block;animation:dxfade .25s ease}
  @keyframes dxfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .dx-sech{margin-bottom:20px}
  .dx-sech h2{font-size:23px;font-weight:800;letter-spacing:-.02em}
  .dx-sech p{margin-top:5px;color:var(--text-2);font-size:14px;max-width:880px}
  .dx-src{font:500 10.5px var(--mono);color:var(--text-2);background:var(--card);border:1px solid var(--line);padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dx-src::before{content:"";width:6px;height:6px;border-radius:50%;background:#0563C1}
  .dx-srcrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dx-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .dx-cardh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .dx-cardh h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .dx-cardh .sub{font-size:12px;color:var(--text-2);margin-top:2px}
  .dx-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .dx-kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 17px}
  .dx-kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
  .dx-kpi .l{font-size:12px;color:var(--text-2);margin-top:3px}
  .dx-kpi .d{font-size:11.5px;font-weight:700;margin-top:9px;display:inline-flex;align-items:center;gap:4px}
  .dx-kpi .d.up{color:#1E7F4F}.dx-kpi .d.dn{color:#E8451C}.dx-kpi .d.fl{color:#8B8B8B}
  .dx-kpi .s{font:500 9.5px var(--mono);color:#9aa0a8;margin-top:9px;display:block}
  .dx-grid{display:grid;gap:16px}
  .dx-g2{grid-template-columns:1fr 1fr}.dx-g3{grid-template-columns:repeat(3,1fr)}.dx-g23{grid-template-columns:1.4fr 1fr}.dx-g32{grid-template-columns:1fr 1.4fr}
  .dx-hbar{display:flex;align-items:center;gap:12px;margin:9px 0}
  .dx-hbar .nm{width:184px;font-size:12.5px;font-weight:600;flex:none}
  .dx-hbar .tk{flex:1;height:13px;background:#EDEFF3;border-radius:7px;overflow:hidden}
  .dx-hbar .fl2{height:100%;border-radius:7px}
  .dx-hbar .vv{width:92px;text-align:right;font:700 12px var(--mono);flex:none}
  .dx-table{width:100%;border-collapse:collapse;font-size:13px}
  .dx-table th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
  .dx-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  .dx-table tr:last-child td{border-bottom:0}
  .dx-table td.num{font:600 12.5px var(--mono);white-space:nowrap}
  .dx-table tr.click{cursor:pointer}.dx-table tr.click:hover{background:#FAFBFC}
  .pill{font:600 11px var(--display);padding:3px 9px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .pill.hi{background:rgba(232,69,28,.12);color:#C7521A}.pill.md{background:rgba(248,151,57,.15);color:#9a5c12}.pill.lo{background:#EAF3EC;color:#1E7F4F}.pill.bl{background:rgba(5,99,193,.12);color:#0563C1}.pill.gy{background:#EFF1F4;color:#5b6068}
  .pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor}
  .cert{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--display);color:#1E7F4F}
  .cert svg{width:13px;height:13px}
  .dx-note{font-size:11.5px;color:var(--text-2);margin-top:14px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}
  .dx-note svg{width:14px;height:14px;color:#F89739;flex:none;margin-top:1px}
  .dx-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-2)}
  .dx-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .dx-pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .dx-stage{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--card);text-align:center}
  .dx-stage .sn{font:700 10px var(--mono);color:#7E8794;text-transform:uppercase;letter-spacing:.05em}
  .dx-stage .sc{font-size:22px;font-weight:800;margin-top:5px;color:#09131B}
  .dx-stage.acc{border-color:rgba(30,127,79,.4);background:rgba(30,127,79,.05)}
  .dx-stage.acc .sc{color:#1E7F4F}
  /* ===== Ask Cortex ===== */
  .dx-ask{background:linear-gradient(135deg,#0E1A22,#09131B);border-radius:14px;padding:16px 18px;margin-bottom:20px}
  .dx-ask .at{display:flex;align-items:center;gap:9px;color:#F89739;font:700 12px var(--display);letter-spacing:.04em;text-transform:uppercase}
  .dx-ask .ar{display:flex;gap:10px;margin-top:11px}
  .dx-ask input{flex:1;background:rgba(244,244,244,.07);border:1px solid rgba(214,220,228,.18);border-radius:10px;color:#F4F4F4;font:500 13.5px var(--display);padding:11px 14px}
  .dx-ask input::placeholder{color:#7E8794}
  .dx-ask .go{background:#F89739;border:0;color:#09131B;border-radius:10px;font:700 13px var(--display);padding:0 18px;cursor:pointer}
  .dx-ask .ans{margin-top:13px;background:rgba(244,244,244,.05);border:1px solid rgba(214,220,228,.14);border-radius:11px;padding:14px 16px;color:#E8EAEE;font-size:13.5px;line-height:1.55;display:none}
  .dx-ask .ans.show{display:block}
  .dx-ask .ans .qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dx-ask .ans .qs .dx-src{background:rgba(244,244,244,.06);border-color:rgba(214,220,228,.16);color:#A9AFB6}
  .dx-ask .ans b{color:#fff}
  .dx-ask .conf{font:700 10px var(--mono);color:#7FD1A8;text-transform:uppercase;letter-spacing:.05em;margin-top:11px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .dx-ask .conf .hum{color:#E9C46A}
  .dx-ask .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .dx-ask .chips button{background:rgba(244,244,244,.06);border:1px solid rgba(214,220,228,.16);color:#C7CCD3;border-radius:999px;font:500 12px var(--display);padding:7px 12px;cursor:pointer}
  .dx-ask .chips button:hover{border-color:#F89739;color:#fff}
  .golink{color:#0563C1;font-weight:700;cursor:pointer}.golink:hover{text-decoration:underline}

  /* ===== Atlas module CSS (prefixed at-, scoped under #atApp) ===== */
  #atApp .at-rail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  #atApp .at-lane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  #atApp .at-lane .lh{font:700 10px var(--display);letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:9px}
  #atApp .at-lane .lh .ld2{width:9px;height:9px;border-radius:3px;flex:none}
  #atApp .at-lane.asis .lh{color:#5b6068}
  #atApp .at-lane.asis .lh .ld2{background:#8B8B8B}
  #atApp .at-lane.auto .lh{color:#0563C1}
  #atApp .at-lane.auto .lh .ld2{background:#0563C1}
  #atApp .at-lane.intel .lh{color:#9a5c12}
  #atApp .at-lane.intel .lh .ld2{background:#F89739}
  #atApp .at-lane .lc{display:flex;flex-wrap:wrap;gap:6px}
  #atApp .at-lane .lc span{font:600 11px var(--display);padding:4px 9px;border-radius:6px;background:#F7F8FA;color:#3F3F3F;border:1px solid var(--line)}
  #atApp .at-lane.auto .lc span{background:rgba(5,99,193,.06);border-color:rgba(5,99,193,.25)}
  #atApp .at-lane.intel .lc span{background:rgba(248,151,57,.08);border-color:rgba(248,151,57,.3)}
  @media(max-width:1080px){#atApp .at-rail{grid-template-columns:1fr}}
  #atApp .at-rag{font:700 10.5px var(--display);padding:3px 9px 3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  #atApp .at-rag .rd{width:7px;height:7px;border-radius:50%;background:currentColor}
  #atApp .at-rag.g{background:#EAF3EC;color:#1E7F4F}
  #atApp .at-rag.a{background:rgba(248,151,57,.16);color:#9a5c12}
  #atApp .at-rag.r{background:rgba(232,69,28,.12);color:#C7521A}
  #atApp .at-rag.b{background:rgba(5,99,193,.12);color:#0563C1}
  #atApp .at-rag.n{background:#EFF1F4;color:#5b6068}
  #atApp .at-tier{font:700 10.5px var(--display);padding:3px 9px 3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  #atApp .at-tier .td{width:7px;height:7px;border-radius:50%;background:currentColor}
  #atApp .at-tier.gold{background:#F6EFD6;color:#8a6d1a}
  #atApp .at-tier.silver{background:#EBEDF1;color:#5b6068}
  #atApp .at-tier.bronze{background:#F0E2D4;color:#8a5a2b}
  #atApp .at-map{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  #atApp .at-node{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:box-shadow .15s,border-color .15s;text-align:left}
  #atApp .at-node:hover{box-shadow:var(--shadow);border-color:#C2C9D2}
  #atApp .at-node .nh{font:700 13px var(--display);display:flex;align-items:center;gap:8px}
  #atApp .at-node .nh svg{width:16px;height:16px;color:#7E8794}
  #atApp .at-node .nc{font-size:23px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
  #atApp .at-node .nl{font-size:11.5px;color:var(--text-2);margin-top:2px}
  #atApp .at-node .nrel{font:600 9.5px var(--mono);color:#9aa0a8;margin-top:10px;text-transform:uppercase;letter-spacing:.04em;line-height:1.5}
  #atApp .at-signals{display:flex;flex-direction:column;gap:10px}
  #atApp .at-signal{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
  #atApp .at-signal:hover{border-color:#C2C9D2}
  #atApp .at-signal .si{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:#F4F4F4}
  #atApp .at-signal .si svg{width:16px;height:16px;color:#5b6068}
  #atApp .at-signal .st{font:700 13px var(--display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #atApp .at-signal .sd{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.5}
  #atApp .at-adv{font:700 10px var(--mono);color:#1E7F4F;text-transform:uppercase;letter-spacing:.05em;margin-top:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  #atApp .at-adv .hum{color:#9a5c12}
  #atApp .at-adv.amber{color:#9a5c12}
  #atApp .at-alert{border:1px solid rgba(248,151,57,.35);background:rgba(248,151,57,.06);border-radius:12px;padding:15px 16px}
  #atApp .at-alert.red{border-color:rgba(232,69,28,.3);background:rgba(232,69,28,.05)}
  #atApp .at-alert .ah{font:700 13px var(--display);display:flex;align-items:center;gap:8px}
  #atApp .at-alert .ah svg{width:16px;height:16px;color:#F89739}
  #atApp .at-alert.red .ah svg{color:#E8451C}
  #atApp .at-alert .ad{font-size:12.5px;color:var(--text-2);margin-top:6px;line-height:1.55}
  #atApp .at-scrim{position:absolute;inset:0;background:rgba(9,19,27,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  #atApp .at-scrim.open{opacity:1;pointer-events:auto}
  #atApp .at-drawer{position:absolute;top:0;right:0;height:100%;width:min(760px,94%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .24s ease;z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  #atApp .at-drawer.open{transform:none}
  #atApp .at-dh{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
  #atApp .at-dh h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
  #atApp .at-dh .dsub{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.5}
  #atApp .at-dclose{margin-left:auto;background:#F4F4F4;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;color:#5b6068;font-size:18px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
  #atApp .at-dclose:hover{background:#EDEFF3}
  #atApp .at-dbody{flex:1;overflow:auto;padding:18px 20px 70px}
  #atApp .at-dgrp{margin-bottom:18px}
  #atApp .at-dgrp>.gh{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#7E8794;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #atApp .at-dl{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  #atApp .at-dl>div{background:var(--card);padding:9px 12px}
  #atApp .at-dl dt{font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  #atApp .at-dl dd{font-size:13px;font-weight:600;margin-top:3px;word-break:break-word}
  #atApp .at-dl div.full{grid-column:1 / -1}
  #atApp .at-seg{display:inline-flex;background:#EDEFF3;border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
  #atApp .at-seg button{background:transparent;border:0;border-radius:7px;font:600 12px var(--display);padding:7px 12px;cursor:pointer;color:#5b6068}
  #atApp .at-seg button.on{background:var(--card);color:#09131B;box-shadow:0 1px 2px rgba(20,19,43,.08)}
  #atApp .at-lock{font:600 12px var(--display);color:#7E8794;background:#F4F4F4;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:9px}
  #atApp .at-lock svg{width:15px;height:15px;color:#9aa0a8;flex:none}
  #atApp .at-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  #atApp .at-field{display:flex;flex-direction:column;gap:6px}
  #atApp .at-field.full{grid-column:1 / -1}
  #atApp .at-field label{font:600 11.5px var(--display);color:var(--text-2)}
  #atApp .at-field input,#atApp .at-field select,#atApp .at-field textarea{font:500 13px var(--display);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}
  #atApp .at-field input:focus,#atApp .at-field select:focus,#atApp .at-field textarea:focus{outline:none;border-color:#F89739}
  #atApp .at-btn{background:#F89739;border:0;color:#09131B;border-radius:9px;font:700 13px var(--display);padding:10px 16px;cursor:pointer}
  #atApp .at-btn:hover{filter:brightness(1.05)}
  #atApp .at-btn2{background:var(--card);border:1px solid var(--line);color:#09131B;border-radius:9px;font:600 13px var(--display);padding:10px 16px;cursor:pointer}
  #atApp .at-btn2:hover{background:#FAFBFC;border-color:#C2C9D2}
  #atApp .at-btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
  #atApp .at-lin{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #atApp .at-lin .ln{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:160px}
  #atApp .at-lin .ln .lk{font:600 9.5px var(--mono);color:#7E8794;text-transform:uppercase;letter-spacing:.04em}
  #atApp .at-lin .ln .lv{font:700 13px var(--display);margin-top:3px}
  #atApp .at-lin .ln .lm{font-size:11px;color:var(--text-2);margin-top:2px}
  #atApp .at-lin .lar{color:#9aa0a8;font-weight:800;font-size:18px}
  #atApp .at-lin .ln.click{cursor:pointer}
  #atApp .at-lin .ln.click:hover{border-color:#F89739}
  #atApp .at-toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0E1A22;color:#F4F4F4;border:1px solid rgba(214,220,228,.2);border-radius:10px;padding:12px 18px;font:600 13px var(--display);opacity:0;pointer-events:none;transition:all .25s;z-index:60;display:flex;align-items:center;gap:9px;max-width:90%}
  #atApp .at-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

      +'</div>';
  }
  function wireTpa(){document.querySelectorAll('#atApp [data-tpa]').forEach(function(tr){tr.onclick=function(){openDrawer(drawerTpa(tr.getAttribute('data-tpa')));};});}

  /* ===== render / nav / wiring ===== */
  var RENDER={overview:secOverview,requests:secRequests,catalogue:secCatalogue,kpis:secKpis,vendors:secVendors,tpa:secTpa,vendorplus:secVendorPlus};
  var CUR='overview';
  function renderSec(id){
    var el=document.querySelector('#atApp .dx-sec[data-sec="'+id+'"]');
    el.innerHTML=RENDER[id]();
    wireAsk();wireLinks();
    if(id==='requests')wireRequests();
    if(id==='catalogue')wireCatalogue();
    if(id==='kpis')wireKpis();
    if(id==='vendors')wireVendors();
    if(id==='vendorplus')wireVendorPlus();
    if(id==='tpa')wireTpa();
  }
  function showSec(id){
    CUR=id;closeDrawer();
    document.querySelectorAll('#atApp .dx-sec').forEach(function(s){s.classList.toggle('on',s.dataset.sec===id);});
    document.querySelectorAll('#atNav .dx-navi').forEach(function(b){b.classList.toggle('on',b.dataset.s===id);});
    renderSec(id);document.getElementById('atMain').scrollTop=0;
  }
  function wireLinks(){
    document.querySelectorAll('#atApp [data-go]').forEach(function(e){e.onclick=function(ev){ev.stopPropagation();closeDrawer();showSec(e.getAttribute('data-go'));};});
  }
  function buildNav(){
    var n=document.getElementById('atNav');var byKey={};NAV.forEach(function(x){byKey[x[0]]=x;});
    n.innerHTML=GROUPS.map(function(g,gi){return '<div class="dx-navh"'+(gi>0?' style="margin-top:8px"':'')+'>'+g[0]+'</div>'+
      g[1].map(function(k){var x=byKey[k];return '<button class="dx-navi'+(k==='overview'?' on':'')+'" data-s="'+k+'" title="'+(DESC[k]||'')+'">'+sIco+x[2]+'</svg><span>'+x[1]+'</span></button>';}).join('');}).join('');
    n.querySelectorAll('.dx-navi').forEach(function(b){b.onclick=function(){showSec(b.dataset.s);};});
  }

  /* ===== entry / exit ===== */
  window.openat=function(){
    ['hcpApp','nbcApp','omniApp','dxApp','psApp','bpApp','mpApp','vaApp'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('open');});
    document.getElementById('atApp').classList.add('open');
    document.body.style.overflow='hidden';
    buildNav();showSec('overview');
  };
  function closeat(){document.getElementById('atApp').classList.remove('open');document.body.style.overflow='';}
  document.getElementById('atBack').onclick=closeat;
  document.getElementById('atScrim').onclick=closeDrawer;
  document.getElementById('atDiv').onchange=function(){CUR_DIV=this.value;showSec(CUR);};
  document.getElementById('atFy').onchange=function(){showSec(CUR);};
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    var app=document.getElementById('atApp');if(!app.classList.contains('open'))return;
    if(document.getElementById('atDrawer').classList.contains('open'))closeDrawer();else closeat();
  });
  /* STANDALONE: auto-open so the mock shows on load */
  window.openat();
})();
</script>
</body>
</html>
